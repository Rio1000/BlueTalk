name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Recent XcodeGen emits a project format newer Xcodes read; make sure
      # the newest installed Xcode is the one driving the build.
      - name: Select newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Build for iOS Simulator (no signing)
        run: >
          xcodebuild build
          -project ios/BlueTalk.xcodeproj
          -scheme BlueTalk
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
